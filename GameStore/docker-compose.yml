services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gamestore
      POSTGRES_USER: gamestore
      POSTGRES_PASSWORD: gamestore_dev
    ports:
      - "5432:5432"
    volumes:
      - gamestore-postgres:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamestore -d gamestore"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-connectivity:
    image: postgres:17-alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        echo "Resolving Docker host gateway..."
        getent hosts host.docker.internal
        echo "Checking PostgreSQL at host.docker.internal:5432..."
        attempt=0
        until pg_isready -h host.docker.internal -p 5432 -U gamestore -d gamestore -t 2; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 10 ]; then
            echo "PostgreSQL is not reachable through the Docker host gateway." >&2
            exit 1
          fi
          sleep 2
        done
        echo "PostgreSQL is reachable from the API network."
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://gamestore:gamestore_dev@host.docker.internal:5432/gamestore?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting the API}
      APP_ENV: ${APP_ENV:-development}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      HTTP_ADDR: :8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      db-connectivity:
        condition: service_completed_successfully

volumes:
  gamestore-postgres:
